[project]
name = "open-ontology-server"
version = "0.2.0"
description = "Open Ontology backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "aiomysql>=0.2.0",
    "openpyxl>=3.1.0",
    "python-calamine>=0.2.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "deepagents>=0.4.12",
    "langgraph-checkpoint-postgres>=3.0.5",
    "sqlparse>=0.5.5",
    "pymupdf>=1.27.2.2",
    "python-docx>=1.2.0",
    "langchain-openai>=1.1.12",
]

[project.scripts]
oo = "cli.main:app"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
