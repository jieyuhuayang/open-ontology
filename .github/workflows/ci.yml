name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontology
          POSTGRES_PASSWORD: ontology
          POSTGRES_DB: open_ontology_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontology"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ontology:ontology@localhost:5432/open_ontology_test
      DATABASE_URL: postgresql+asyncpg://ontology:ontology@localhost:5432/open_ontology_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -v
